<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2333" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00E676" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D50000" />
    </linearGradient>
  </defs>

  <!-- App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2D3345" stroke-width="6" />

  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)" />

  <!-- 8 Radial Spikes -->
  <g stroke="url(#mineGrad)" stroke-width="36" stroke-linecap="round">
    <line x1="256" y1="76" x2="256" y2="436" />
    <line x1="76" y1="256" x2="436" y2="256" />
    <line x1="128" y1="128" x2="384" y2="384" />
    <line x1="384" y1="128" x2="128" y2="384" />
  </g>

  <!-- Center Sphere -->
  <circle cx="256" cy="256" r="128" fill="url(#mineGrad)" />

  <!-- Specular shine highlight -->
  <circle cx="220" cy="220" r="28" fill="#FFFFFF" opacity="0.8" />
</svg>
