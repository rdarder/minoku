<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- 8 Radial Spikes (cardinal and diagonal) -->
  <g stroke="#14161C" stroke-width="12" stroke-linecap="round">
    <!-- Cardinal: Up, Down, Left, Right -->
    <line x1="80" y1="16" x2="80" y2="144" />
    <line x1="16" y1="80" x2="144" y2="80" />
    <!-- Diagonal: 45, 135, 225, 315 deg -->
    <line x1="34.8" y1="34.8" x2="125.2" y2="125.2" />
    <line x1="125.2" y1="34.8" x2="34.8" y2="125.2" />
  </g>
  
  <!-- Solid clean central sphere (Diameter 84, big & bold) -->
  <circle cx="80" cy="80" r="42" fill="#14161C" />

  <!-- Classic clean specular shine glint (top-left) -->
  <circle cx="68" cy="68" r="8" fill="#FFFFFF" opacity="0.85" />
</svg>